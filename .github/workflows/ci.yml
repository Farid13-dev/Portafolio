name: CI

# Gitflow: develop recibe las features y main lo que se publica.
# Vercel despliega por su cuenta (preview en cada push, producción desde main);
# este workflow es la barrera de calidad antes de mezclar.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Necesarias para el build: las páginas se generan en build (ISR) leyendo la BD.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        if: env.DATABASE_URL != ''
        run: bun run build

      - name: Build omitido
        if: env.DATABASE_URL == ''
        run: echo "::warning::Define los secrets DATABASE_URL y DIRECT_URL en GitHub para que el CI ejecute next build (Vercel sí lo ejecuta en cada deploy)."
